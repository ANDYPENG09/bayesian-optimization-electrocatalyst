name: BO numerical regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_synthetic_closed_loop.py --output demo_output
      - run: python scripts/bo_pipeline.py --data assets/experiment_ptco_example.csv --config assets/config_ptco_example.yaml --batch 3 --out demo_output/ptco.json --trace demo_output/ptco-trace.json
